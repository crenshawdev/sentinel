# cargo-deny baseline. check.sh uses the repo's own deny.toml instead when the
# repo has one, so a project that needs an exception copies this file and
# edits its copy.

[advisories]
# Vulnerability advisories always fail; cargo-deny no longer allows turning
# that off. These make the other advisory kinds fail too.
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
]
# A baseline list always has entries a given project never uses.
unused-allowed-license = "allow"

[licenses.private]
# Skip the project's own unpublished crates (publish = false).
ignore = true

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
