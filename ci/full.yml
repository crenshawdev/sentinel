# sentinel full audit: mechanical checks, then every lens through fanout.sh,
# then merge.sh, with audit/ uploaded as an artifact. Runs on demand and on
# the 1st of each month.
#
# Adjudication stays manual for now: download the artifact and run
# adjudicator.md against merged.md by hand.
#
# Copy this file into .github/workflows/ (GitHub) or .forgejo/workflows/
# (Forgejo) in the repo under audit. It expects sentinel as a git submodule at
# the path in SENTINEL_DIR, and the secrets ANTHROPIC_API_KEY and
# OPENAI_API_KEY.
#
# The two jobs are the same audit. They differ only because GitHub and Forgejo
# need different artifact upload actions and neither accepts the other's:
# upstream actions/upload-artifact@v4 does not work on Forgejo, and GitHub does
# not accept the full-URL `uses:` form Forgejo would need for its patched copy.
# Each job runs only on its own platform.
#
# The API keys are set only on the fanout step, never while check.sh builds
# the repo's code.
name: sentinel-full

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of each month

env:
  SENTINEL_DIR: .sentinel
  RUNS_PER_LENS: "3"

permissions:
  contents: read

jobs:
  audit-github:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: '"$SENTINEL_DIR/ci/install-tools.sh" --all'
      - name: Install Claude Code and Codex
        id: clis
        run: npm install -g @anthropic-ai/claude-code @openai/codex
      - name: Let the Codex sandbox create user namespaces
        # Ubuntu's AppArmor policy blocks the bubblewrap sandbox Codex uses.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Mechanical checks
        run: '"$SENTINEL_DIR/mechanical/check.sh" .'
      - name: Fan out lenses
        id: fanout
        if: ${{ !cancelled() && steps.clis.outcome == 'success' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: '"$SENTINEL_DIR/fanout.sh" . "$RUNS_PER_LENS"'
      - name: Merge findings
        if: ${{ !cancelled() && steps.fanout.outcome != 'skipped' }}
        run: '"$SENTINEL_DIR/merge.sh" "$(ls -d audit/*/ | sort | tail -n 1)"'
      - name: Upload audit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-audit
          path: audit/
          retention-days: 14

  audit-forgejo:
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: '"$SENTINEL_DIR/ci/install-tools.sh" --all'
      - name: Install Claude Code and Codex
        id: clis
        run: npm install -g @anthropic-ai/claude-code @openai/codex
      - name: Mechanical checks
        run: '"$SENTINEL_DIR/mechanical/check.sh" .'
      - name: Fan out lenses
        id: fanout
        if: ${{ !cancelled() && steps.clis.outcome == 'success' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: '"$SENTINEL_DIR/fanout.sh" . "$RUNS_PER_LENS"'
      - name: Merge findings
        if: ${{ !cancelled() && steps.fanout.outcome != 'skipped' }}
        run: '"$SENTINEL_DIR/merge.sh" "$(ls -d audit/*/ | sort | tail -n 1)"'
      - name: Upload audit
        if: ${{ !cancelled() }}
        # Resolves to Forgejo's patched upload-artifact through DEFAULT_ACTIONS_URL.
        uses: forgejo/upload-artifact@v4
        with:
          name: sentinel-audit
          path: audit/
          retention-days: 14
